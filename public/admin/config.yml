# Decap CMS configuration — commits property files straight to GitHub.
# Production uses Netlify Identity + Git Gateway (no server, no database).
# Local development: `local_backend` only activates on localhost with `npx decap-server`.

backend:
  name: git-gateway
  branch: main
  # Absolute Identity + Git Gateway URLs so a www/netlify.app hop cannot
  # strip the Bearer token on /.netlify/git/settings.
  identity_url: https://gulbargahomes.com/.netlify/identity
  gateway_url: https://gulbargahomes.com/.netlify/git
  # Keep the git-gateway JWT fresh; the admin script also refreshes every 3 minutes.
  commit_messages:
    create: "Create {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

local_backend: true

site_url: https://gulbargahomes.com
display_url: https://gulbargahomes.com
logo_url: /icon.svg

editor:
  preview: false

# Image uploads: Git repo under public/images/properties, or Cloudinary when
# NEXT_PUBLIC_CLOUDINARY_* Netlify env vars are set (see README).
media_folder: "public/images/properties"
public_folder: "/images/properties"

collections:
  - name: "properties"
    label: "Properties"
    label_singular: "Property"
    folder: "content/properties"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    summary: "{{title}} — {{locality}} · {{status}}"
    fields:
      - { name: "slug", label: "Slug", widget: "string", hint: "URL path, e.g. 2bhk-flat-rent-sedam-road" }
      - { name: "title", label: "Title", widget: "string" }
      - { name: "listing", label: "Listing", widget: "select", options: ["Rent", "Sale"] }
      - {
          name: "status",
          label: "Availability",
          widget: "select",
          default: "Available",
          options: ["Available", "Rented", "Sold"],
          hint: "Set to Rented or Sold when taken. The listing stays on the website for Google — it is hidden only when visitors filter by availability.",
        }
      - {
          name: "propertyType",
          label: "Property Type",
          widget: "select",
          options: ["House", "Flat", "Villa", "Plot", "Commercial", "PG"],
        }
      - { name: "bhk", label: "BHK", widget: "number", required: false, value_type: "int" }
      - { name: "price", label: "Price (INR)", widget: "number", value_type: "int" }
      - { name: "priceSuffix", label: "Price Suffix", widget: "string", required: false, default: "" }
      - { name: "area", label: "Area (sqft)", widget: "number", value_type: "int" }
      - {
          name: "locality",
          label: "Locality",
          widget: "string",
          hint: "Main Gulbarga / Kalaburagi area — e.g. Sedam Road, Azadpur, Biddapur Colony, Kusnoor. You can type any new area; it appears in site filters after publish.",
        }
      - { name: "city", label: "City", widget: "string", default: "Gulbarga" }
      - { name: "facing", label: "Facing", widget: "select", options: ["East", "West", "North", "South"] }
      - { name: "vastu", label: "Vastu Compliant", widget: "boolean", default: false }
      - { name: "vegetarian", label: "Vegetarian", widget: "select", options: ["Yes", "Preferred", "Not Required"] }
      - { name: "bachelors", label: "Bachelors", widget: "select", options: ["Allowed", "Not Allowed"] }
      - { name: "family", label: "Family", widget: "select", options: ["Preferred", "Allowed"] }
      - { name: "parking", label: "Parking", widget: "string" }
      - { name: "bathrooms", label: "Bathrooms", widget: "number", value_type: "int", default: 0 }
      - {
          name: "furnished",
          label: "Furnishing",
          widget: "select",
          options: ["Fully Furnished", "Semi Furnished", "Unfurnished"],
        }
      - { name: "featured", label: "Featured", widget: "boolean", default: false }
      - { name: "isNew", label: "New Listing", widget: "boolean", default: true }
      - {
          name: "publishedAt",
          label: "Published date",
          widget: "datetime",
          required: false,
          hint: "Used as Google video uploadDate and sitemap lastmod. Leave blank to use the file date. Set it once and keep it stable so video snippets stay valid.",
        }
      - { name: "coverImage", label: "Cover Image", widget: "image" }
      - { name: "gallery", label: "Gallery Images", widget: "list", field: { name: "image", label: "Image", widget: "image" } }
      - name: "videos"
        label: "Videos"
        widget: "list"
        required: false
        hint: "Upload MP4 (Cloudinary when configured) and/or paste a YouTube URL. Videos appear in the property gallery."
        fields:
          - { name: "title", label: "Title", widget: "string", required: false, default: "Property video" }
          - {
              name: "src",
              label: "Video file (MP4)",
              widget: "file",
              required: false,
              media_folder: "../../public/videos/properties",
              public_folder: "/videos/properties",
            }
          - {
              name: "youtubeUrl",
              label: "YouTube URL",
              widget: "string",
              required: false,
              hint: "Optional if you uploaded a file. Example: https://www.youtube.com/watch?v=…",
            }
          - { name: "thumbnail", label: "Thumbnail", widget: "image", required: false }
      - { name: "body", label: "Description", widget: "markdown" }
      - { name: "amenities", label: "Amenities", widget: "list", field: { name: "a", label: "Amenity", widget: "string" } }
      - { name: "rules", label: "Rules", widget: "list", field: { name: "r", label: "Rule", widget: "string" } }
      - name: "nearby"
        label: "Nearby"
        widget: "object"
        fields:
          - { name: "schools", label: "Schools", widget: "list", field: { name: "s", label: "School", widget: "string" } }
          - { name: "hospitals", label: "Hospitals", widget: "list", field: { name: "h", label: "Hospital", widget: "string" } }
          - { name: "busStop", label: "Bus Stop", widget: "string" }
          - { name: "railway", label: "Railway", widget: "string" }
      - name: "faq"
        label: "FAQ"
        widget: "list"
        required: false
        default: []
        fields:
          - { name: "question", label: "Question", widget: "string" }
          - { name: "answer", label: "Answer", widget: "text" }
      - { name: "mapQuery", label: "Map Query", widget: "string", hint: "e.g. Sedam Road, Kalaburagi, Karnataka" }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    summary: "{{name}} — {{status}} · {{locality}}"
    media_folder: "public/images/projects"
    public_folder: "/images/projects"
    fields:
      - { name: "slug", label: "Slug", widget: "string", hint: "URL: /projects/your-slug" }
      - { name: "name", label: "Project name", widget: "string" }
      - {
          name: "category",
          label: "Category",
          widget: "select",
          options:
            [
              "House construction",
              "Residential construction",
              "Modular kitchen",
              "Interior design",
              "Home renovation",
              "Design & planning",
              "Other",
            ],
        }
      - {
          name: "status",
          label: "Status",
          widget: "select",
          default: "ongoing",
          options: ["completed", "ongoing", "upcoming", "planning"],
        }
      - {
          name: "statusLabel",
          label: "Status label (optional)",
          widget: "string",
          required: false,
          hint: "Leave blank to use Completed / Ongoing / etc. automatically.",
        }
      - {
          name: "locality",
          label: "Locality",
          widget: "string",
          hint: "Kalaburagi area — e.g. Sai Nagar, High Court, Biddapur Colony.",
        }
      - { name: "city", label: "City", widget: "string", default: "Gulbarga" }
      - {
          name: "summary",
          label: "Short summary",
          widget: "text",
          hint: "Shown on homepage portfolio card and search.",
        }
      - {
          name: "constructionStage",
          label: "Construction stage",
          widget: "string",
          required: false,
          hint: "For ongoing builds — e.g. Masonry, Slab, Finishing.",
        }
      - { name: "builtUpArea", label: "Built-up area", widget: "string", required: false }
      - { name: "scope", label: "Scope", widget: "text", required: false }
      - { name: "startedAt", label: "Start date", widget: "datetime", required: false }
      - { name: "completedAt", label: "Completion date", widget: "datetime", required: false }
      - { name: "featured", label: "Featured on homepage", widget: "boolean", default: false }
      - {
          name: "isExample",
          label: "Layout placeholder only",
          widget: "boolean",
          default: false,
          hint: "Leave off for real GulbargaHomes projects. Turn on only for temporary demo entries.",
        }
      - { name: "coverImage", label: "Cover image", widget: "image" }
      - {
          name: "gallery",
          label: "Gallery",
          widget: "list",
          required: false,
          field: { name: "image", label: "Image", widget: "image" },
        }
      - { name: "body", label: "Project story", widget: "markdown" }
      - {
          name: "disclaimer",
          label: "Disclaimer (optional)",
          widget: "text",
          required: false,
          hint: "Override the default example disclaimer when needed.",
        }
