<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Reset password — GulbargaHomes Admin</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0f2a24;
        --muted: #5c6b66;
        --surface: #f6f3ec;
        --brand: #1a5142;
        --error: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--surface);
        color: var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 12px 40px rgba(15, 42, 36, 0.12);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
        font-size: 0.95rem;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.85rem;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        font-size: 16px;
        padding: 12px 14px;
        border: 1px solid #d4cfc4;
        border-radius: 10px;
        margin-bottom: 14px;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        background: var(--brand);
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .status {
        margin-top: 16px;
        font-size: 0.9rem;
        line-height: 1.45;
      }
      .status.error {
        color: var(--error);
      }
      a {
        color: var(--brand);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Set a new password</h1>
      <p id="intro">Use the link from your Netlify reset email. This page works without the Identity popup.</p>

      <form id="form" hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />

        <label for="password2">Confirm password</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8" />

        <button type="submit" id="submit">Save password</button>
      </form>

      <div id="status" class="status" role="status"></div>
      <p class="footer"><a href="/admin/index.html">Back to admin login</a></p>
    </main>

    <script>
      (function () {
        var IDENTITY_API = "https://gulbargahomes.com/.netlify/identity";

        var form = document.getElementById("form");
        var statusEl = document.getElementById("status");
        var intro = document.getElementById("intro");
        var submitBtn = document.getElementById("submit");

        var accessToken = null;

        function parseHashParams(hash) {
          var out = {};
          var h = (hash || "").replace(/^#/, "");
          if (!h) return out;
          h.split("&").forEach(function (part) {
            var i = part.indexOf("=");
            if (i === -1) return;
            var key = decodeURIComponent(part.slice(0, i));
            var val = decodeURIComponent(part.slice(i + 1));
            out[key] = val;
          });
          return out;
        }

        function getRecoveryToken() {
          var fromQuery = new URLSearchParams(window.location.search).get("recovery_token");
          if (fromQuery) return fromQuery;
          var fromHash = parseHashParams(window.location.hash).recovery_token;
          return fromHash || null;
        }

        function setStatus(message, isError) {
          statusEl.textContent = message;
          statusEl.className = "status" + (isError ? " error" : "");
        }

        function moveHashToQuery() {
          var token = parseHashParams(window.location.hash).recovery_token;
          if (!token) return false;
          var url =
            "/admin/recover.html?recovery_token=" +
            encodeURIComponent(token) +
            "&type=recovery";
          window.location.replace(url);
          return true;
        }

        if (moveHashToQuery()) return;

        var token = getRecoveryToken();
        if (!token) {
          intro.textContent =
            "No reset token found. Open the full link from your email, or request a new reset from admin login.";
          setStatus(
            "Tip: right-click Reset password in Gmail → Copy link, then paste it here in the address bar.",
            true,
          );
          return;
        }

        setStatus("Checking your reset link…");

        fetch(IDENTITY_API + "/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, type: "recovery" }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (result) {
            if (!result.ok || !result.body.access_token) {
              var msg =
                result.body && result.body.msg
                  ? result.body.msg
                  : "This reset link is invalid, expired, or already used.";
              if (result.status === 429) {
                msg =
                  "Too many attempts. Wait 10–15 minutes, then request one new reset email.";
              }
              setStatus(msg + " Request a fresh link from admin → Forgot password?", true);
              return;
            }

            accessToken = result.body.access_token;
            intro.textContent = "Enter a new password for your GulbargaHomes admin account.";
            setStatus("");
            form.hidden = false;
          })
          .catch(function () {
            setStatus("Network error. Check your connection and try again.", true);
          });

        form.addEventListener("submit", function (event) {
          event.preventDefault();
          if (!accessToken) return;

          var p1 = document.getElementById("password").value;
          var p2 = document.getElementById("password2").value;
          if (p1 !== p2) {
            setStatus("Passwords do not match.", true);
            return;
          }
          if (p1.length < 8) {
            setStatus("Use at least 8 characters.", true);
            return;
          }

          submitBtn.disabled = true;
          setStatus("Saving…");

          fetch(IDENTITY_API + "/user", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + accessToken,
            },
            body: JSON.stringify({ password: p1 }),
          })
            .then(function (res) {
              return res.json().then(function (body) {
                return { ok: res.ok, body: body };
              });
            })
            .then(function (result) {
              if (!result.ok) {
                var msg =
                  result.body && result.body.msg
                    ? result.body.msg
                    : "Could not save password. Try a new reset link.";
                setStatus(msg, true);
                submitBtn.disabled = false;
                return;
              }

              form.hidden = true;
              setStatus(
                "Password updated. You can log in at admin with your email and new password.",
                false,
              );
              window.setTimeout(function () {
                window.location.href = "/admin/index.html";
              }, 2500);
            })
            .catch(function () {
              setStatus("Network error while saving. Try again.", true);
              submitBtn.disabled = false;
            });
        });
      })();
    </script>
  </body>
</html>
