<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>GulbargaHomes Admin</title>
    <!-- Netlify Identity widget — required for git-gateway JWTs. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="/identity-guard.js"></script>
    <script src="/admin/admin-resilience.js"></script>
    <style>
      /*
        Decap CMS git-gateway fallback login form uses margin-top: -80px on AuthForm,
        which makes validation errors overlap the logo when Login is clicked empty.
      */
      form:has(input[name="email"]) {
        margin-top: 0 !important;
      }

      form:has(input[name="email"]) p {
        margin: 0 0 4px;
      }

      html, body {
        min-height: 100%;
        background: #f6f3ec;
      }

      input, select, textarea {
        font-size: 16px !important;
      }
    </style>
  </head>
  <body>
    <!--
      Load Decap only after Identity has initialized so git-gateway
      /.netlify/git/settings is requested with a Bearer token when a
      session already exists. After a fresh login we reload this page
      so the CMS boots with the new JWT.

      Never load Decap while a recovery/invite hash is pending — Decap's
      hash router would erase #recovery_token before Identity can open.
    -->
    <script>
      (function () {
        var IDENTITY_API = "https://gulbargahomes.com/.netlify/identity";
        var cmsLoaded = false;

        function identityEmailPending() {
          if (typeof window.gulbargaHomesIdentityEmailPending === "function") {
            return window.gulbargaHomesIdentityEmailPending();
          }
          return /recovery_token|invite_token|confirmation_token|email_change_token/.test(
            window.location.hash || "",
          );
        }

        function loadCms() {
          if (cmsLoaded || identityEmailPending()) return;
          cmsLoaded = true;
          var script = document.createElement("script");
          script.src = "https://unpkg.com/decap-cms@3.6.3/dist/decap-cms.js";
          document.body.appendChild(script);
        }

        window.addEventListener("gulbarga-identity-email-flow-done", loadCms);

        var identity = window.netlifyIdentity;
        if (!identity) {
          if (!identityEmailPending()) loadCms();
          return;
        }

        try {
          identity.init({ APIUrl: IDENTITY_API });
        } catch (error) {
          /* Widget may already have initialized on this page. */
        }

        identity.on("init", function () {
          if (!identityEmailPending()) loadCms();
        });
        identity.on("login", function () {
          window.location.replace("/admin/index.html");
        });

        window.setTimeout(function () {
          if (!identityEmailPending()) loadCms();
        }, 2500);
      })();
    </script>
  </body>
</html>
