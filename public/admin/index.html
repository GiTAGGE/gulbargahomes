<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>GulbargaHomes Admin</title>
    <!-- Netlify Identity widget — required for git-gateway JWTs. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="/identity-guard.js"></script>
    <script src="/admin/admin-resilience.js"></script>
    <script src="/admin/cloudinary-config.js"></script>
    <script src="https://unpkg.com/decap-cms-media-library-cloudinary@3.1.0/dist/decap-cms-media-library-cloudinary.js"></script>
    <script src="/admin/cloudinary-init.js"></script>
    <style>
      /*
        Decap CMS git-gateway fallback login form uses margin-top: -80px on AuthForm,
        which makes validation errors overlap the logo when Login is clicked empty.
      */
      form:has(input[name="email"]) {
        margin-top: 0 !important;
      }

      form:has(input[name="email"]) p {
        margin: 0 0 4px;
      }

      html, body {
        min-height: 100%;
        background: #f6f3ec;
      }

      input, select, textarea {
        font-size: 16px !important;
      }
    </style>
  </head>
  <body>
    <!--
      Load Decap only after Identity has initialized and (when logged in) refreshed
      its JWT. Loading CMS too early makes Git Gateway think you are logged out even
      when gotrue.user is still in localStorage.
    -->
    <script>
      (function () {
        var IDENTITY_API = "https://gulbargahomes.com/.netlify/identity";
        var DEFAULT_ROUTE = "#/collections/properties";
        var cmsLoaded = false;
        var identityInitFired = false;

        function identityEmailPending() {
          if (typeof window.gulbargaHomesIdentityEmailPending === "function") {
            return window.gulbargaHomesIdentityEmailPending();
          }
          return /invite_token|confirmation_token|email_change_token/.test(
            window.location.hash || "",
          );
        }

        function decapRouteHash() {
          var hash = window.location.hash || "";
          if (/^#\/collections\//.test(hash)) return hash;
          return DEFAULT_ROUTE;
        }

        function loadCms() {
          if (cmsLoaded || identityEmailPending()) return;
          cmsLoaded = true;
          var script = document.createElement("script");
          script.src = "https://unpkg.com/decap-cms@3.6.3/dist/decap-cms.js";
          script.onload = function () {
            if (
              window.__GULBARGA_CLOUDINARY_CONFIG &&
              window.decapCmsMediaLibraryCloudinary &&
              window.CMS
            ) {
              window.decapCmsMediaLibraryCloudinary.init({
                config: window.__GULBARGA_CLOUDINARY_CONFIG,
              });
            }
          };
          document.body.appendChild(script);
        }

        function loadCmsAfterIdentityReady() {
          if (cmsLoaded || identityEmailPending()) return;

          var identity = window.netlifyIdentity;
          if (!identity) {
            loadCms();
            return;
          }

          var user = identity.currentUser && identity.currentUser();
          if (!user || typeof user.jwt !== "function") {
            loadCms();
            return;
          }

          user
            .jwt(true)
            .catch(function () {
              /* Still load CMS so the user can log in again. */
            })
            .then(function () {
              loadCms();
            });
        }

        window.addEventListener("gulbarga-identity-email-flow-done", loadCmsAfterIdentityReady);

        window.gulbargaHomesReloadAdminAfterLogin = function () {
          var target = "/admin/index.html" + decapRouteHash();
          window.location.replace(target);
        };

        var identity = window.netlifyIdentity;
        if (!identity) {
          window.setTimeout(function () {
            if (!identityEmailPending()) loadCms();
          }, 1500);
          return;
        }

        try {
          identity.init({ APIUrl: IDENTITY_API });
        } catch (error) {
          /* Widget may already have initialized on this page. */
        }

        identity.on("init", function () {
          identityInitFired = true;
          if (!identityEmailPending()) loadCmsAfterIdentityReady();
        });

        identity.on("login", function () {
          if (typeof window.gulbargaHomesReloadAdminAfterLogin === "function") {
            window.gulbargaHomesReloadAdminAfterLogin();
          } else {
            window.location.replace("/admin/index.html" + DEFAULT_ROUTE);
          }
        });

        window.setTimeout(function () {
          if (cmsLoaded || identityEmailPending()) return;
          if (!identityInitFired) {
            loadCms();
            return;
          }
          loadCmsAfterIdentityReady();
        }, 8000);
      })();
    </script>
  </body>
</html>
